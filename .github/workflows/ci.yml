name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Корневые npm workspaces: apps/web, apps/server, packages/shared.
      - run: npm ci
      - run: ./scripts/check
      - run: ./scripts/test
